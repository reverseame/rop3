# Load from memory: op1 <- [op2]
ld:
  operands: 2
  dst: [op1]
  src: [op2]

  x86:
    - steps:
        - mnemonic: mov
          op1: op1
          op2: '[op2]'

  arm:
    - steps:
        - mnemonic: ldr
          op1: op1
          op2: '[op2]'

  riscv:
    - steps:
        - mnemonic: ld
          op1: op1
          op2: '[op2]'
    - steps:
        - mnemonic: lw
          op1: op1
          op2: '[op2]'
