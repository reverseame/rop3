# Bitwise AND: op1 <- op1 & op2
and:
  operands: 2
  dst: [op1]
  src: [op1, op2]

  x86:
    - steps:
        - mnemonic: and
          op1: op1
          op2: op2

  arm:
    - steps:
        - mnemonic: and
          op1: op1
          op2: op1
          op3: op2

  riscv:
    # and op1, op1, op2
    - steps:
        - mnemonic: and
          op1: op1
          op2: op1
          op3: op2
    # c.and op1, op2
    - steps:
        - mnemonic: c.and
          op1: op1
          op2: op2
    # andi op1, op1, imm   (op2 binds to the immediate)
    - steps:
        - mnemonic: andi
          op1: op1
          op2: op1
          op3: op2
    # c.andi op1, imm   (op1 <- op1 & imm; op2 binds the immediate)
    - steps:
        - mnemonic: c.andi
          op1: op1
          op2: op2
