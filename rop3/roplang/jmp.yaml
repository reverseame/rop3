# Indirect stack pivot: SP <- op1; a ROP jump.
jmp:
  operands: 1
  dst: []
  src: [op1]

  x86:
    # reuse mov to set the frame pointer, then a `leave` gadget
    - steps:
        - operation: mov
          op1: REG_BP
          op2: op1
        - mnemonic: leave
    - steps:
        - operation: spa
          op1: op1

  arm:
    - steps:
        # Unlikely to exist
        - operation: mov
          op1: REG_SP
          op2: op1
    - steps:
        - operation: mov
          op1: REG_BP
          op2: op1
        - operation: mov
          op1: REG_SP
          op2: REG_BP
    - steps:
        - operation: spa
          op1: op1

  riscv:
    - steps:
        - operation: mov
          op1: REG_SP
          op2: op1
    - steps:
        - mnemonic: addi
          op1: REG_SP
          op2: op1
          op3: ANY
    - steps:
        - operation: spa
          op1: op1
