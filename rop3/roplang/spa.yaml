# Stack pointer addition: SP <- SP + op1 (compound: reuses add)
spa:
  operands: 1
  dst: []
  src: [op1]

  x86:
    - steps:
        - operation: add
          op1: REG_SP
          op2: op1

  arm:
    - steps:
        - operation: add
          op1: REG_SP
          op2: op1

  riscv:
    - steps:
        - operation: add
          op1: REG_SP
          op2: op1
